name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          gh pr view "$PR_NUM" --json title --jq '.title' > /tmp/pr_title.txt
          gh pr view "$PR_NUM" --json author --jq '.author.login' > /tmp/pr_author.txt

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Invoke Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"

          claude --print "Review ${PR_NUM}

          After your review, output findings in EXACTLY this format (parsed programmatically):

          FINDING_START
          ID: <number starting from 1>
          SEVERITY: <BLOCKER|WARNING|SUGGESTION|NIT>
          FILE: <file path or GENERAL if not file-specific>
          LINE: <line number or 0 if not applicable>
          TITLE: <one line summary>
          BODY: <detailed explanation, can be multiline>
          FINDING_END

          After all findings:
          SUMMARY_START
          <2-3 sentence overall assessment>
          SUMMARY_END

          No text outside FINDING_START/END and SUMMARY_START/END blocks." > /tmp/raw_review.txt

      - name: Build Slack messages
        env:
          PR_NUM: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import json, re, os

          raw = open("/tmp/raw_review.txt").read()

          finding_re = re.compile(
              r"FINDING_START\s*\n"
              r"ID:\s*(?P<id>\d+)\s*\n"
              r"SEVERITY:\s*(?P<severity>\w+)\s*\n"
              r"FILE:\s*(?P<file>.+?)\s*\n"
              r"LINE:\s*(?P<line>\d+)\s*\n"
              r"TITLE:\s*(?P<title>.+?)\s*\n"
              r"BODY:\s*(?P<body>.*?)\s*(?=FINDING_END)",
              re.DOTALL,
          )
          summary_re = re.compile(r"SUMMARY_START\s*\n(?P<summary>.*?)\s*\nSUMMARY_END", re.DOTALL)

          findings = []
          for m in finding_re.finditer(raw):
              findings.append({
                  "id": int(m.group("id")),
                  "severity": m.group("severity").strip(),
                  "file": m.group("file").strip(),
                  "line": int(m.group("line")),
                  "title": m.group("title").strip(),
                  "body": m.group("body").strip(),
              })

          sm = summary_re.search(raw)
          summary = sm.group("summary").strip() if sm else ""

          pr_num = int(os.environ["PR_NUM"])
          repo = os.environ["REPO"]
          pr_url = f"https://github.com/{repo}/pull/{pr_num}"
          pr_title = open("/tmp/pr_title.txt").read().strip()
          pr_author = open("/tmp/pr_author.txt").read().strip()

          EMOJI = {
              "BLOCKER": "\U0001f6a8",
              "WARNING": "\u26a0\ufe0f",
              "SUGGESTION": "\U0001f4a1",
              "NIT": "\U0001f50d",
          }

          # Header blocks (thread parent)
          header_blocks = [
              {"type": "header", "text": {"type": "plain_text", "text": f"#{pr_num}: {pr_title}"[:150]}},
              {"type": "section", "text": {"type": "mrkdwn", "text": f"*Author:* {pr_author}  |  <{pr_url}|View PR on GitHub>"}},
          ]
          if summary:
              header_blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": f"*Summary:* {summary}"}})

          counts = {}
          for f in findings:
              counts[f["severity"]] = counts.get(f["severity"], 0) + 1
          stats = "  ".join(
              f'{EMOJI[s]} {counts[s]} {s.lower()}'
              for s in ("BLOCKER", "WARNING", "SUGGESTION", "NIT")
              if s in counts
          )
          if stats:
              header_blocks.append({"type": "context", "elements": [{"type": "mrkdwn", "text": stats}]})

          # Findings text (thread reply)
          parts = []
          for f in findings:
              emoji = EMOJI.get(f["severity"], "")
              loc = f'`{f["file"]}:{f["line"]}`' if f["file"] != "GENERAL" and f["line"] > 0 else "_General_"
              parts.append(f'*{emoji} #{f["id"]} [{f["severity"]}]* {f["title"]}\n{loc}\n{f["body"]}')

          json_blob = json.dumps({"pr_number": pr_num, "repo": repo, "findings": findings})
          parts.append(f"\n<!-- revbot-findings-data\n{json_blob}\n-->")

          with open("/tmp/header_payload.json", "w") as f:
              json.dump({"blocks": header_blocks}, f)
          with open("/tmp/findings_payload.json", "w") as f:
              json.dump({"text": "\n\n".join(parts)}, f)

          print(f"Parsed {len(findings)} findings")
          PYEOF

      - name: Post review header to Slack
        id: slack-header
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL || '#notifications' }}
          payload-file-path: /tmp/header_payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Add thread_ts to findings payload
        run: |
          THREAD_TS="${{ steps.slack-header.outputs.ts }}"
          python3 -c "
          import json
          payload = json.load(open('/tmp/findings_payload.json'))
          payload['thread_ts'] = '${THREAD_TS}'
          json.dump(payload, open('/tmp/findings_payload.json', 'w'))
          "

      - name: Post findings as thread reply
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL || '#notifications' }}
          payload-file-path: /tmp/findings_payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
